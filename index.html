<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Uni-Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<title>Uni-Fahrplan</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1c1c1a;--mu:#6b6b66;--ac:#2a6f6b;--bd:#e2e0d9;--st:#e8a317}
@media (prefers-color-scheme:dark){:root{--bg:#171716;--card:#232321;--tx:#f0efea;--mu:#9a9a93;--ac:#5fb8b2;--bd:#383835}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,sans-serif;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px)}
header{padding:10px 16px 6px;font-weight:700;font-size:20px}
#mapView{flex:1;position:relative;min-height:0}#map{position:absolute;inset:0}
#listView{flex:1;overflow:auto;padding:8px 14px 20px;display:none}
nav{display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px;border:0;background:none;color:var(--mu);font:600 15px system-ui}nav button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;cursor:pointer}.hd b{font-size:17px}
.sub{color:var(--mu);font-size:13px}.stars{color:var(--st);letter-spacing:1px}
.body{padding:0 14px 14px;display:none}.open .body{display:block}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px;font-weight:600}
input,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:16px system-ui}
textarea{min-height:64px;resize:vertical}.g{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.place{margin-top:12px;font-weight:700;font-size:14px;color:var(--ac)}.hint{font-size:12px;color:var(--mu)}
.rate button{border:0;background:none;font-size:28px;color:var(--bd);padding:0 3px}.rate button.on{color:var(--st)}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:1200;background:var(--card);border-top:1px solid var(--bd);border-radius:18px 18px 0 0;padding:14px 16px;display:none;max-height:62%;overflow:auto;box-shadow:0 -6px 24px #0003}
#sheet h3{margin:0 0 4px}.row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.pill{background:var(--bg);border-radius:8px;padding:6px 10px;font-size:14px;margin:2px 0}
.btn{margin-top:10px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:600 15px system-ui}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
#addb{position:absolute;right:12px;bottom:14px;z-index:1100;width:56px;height:56px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:30px;box-shadow:0 3px 10px #0004}
#banner{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1100;background:var(--card);padding:8px 14px;border-radius:10px;box-shadow:0 2px 8px #0003;display:none;font-size:14px;max-width:90%}
.del{margin-top:14px;width:100%;padding:10px;border:1px solid #c0392b;border-radius:10px;background:none;color:#c0392b;font:600 14px system-ui}
.mk{display:flex;flex-direction:column;align-items:center;width:max-content;transform:translate(-50%,-100%)}
.mk i{width:18px;height:18px;border-radius:50%;background:#2a6f6b;border:3px solid #fff;box-shadow:0 1px 5px #0006}
.mk.c i{background:#d9822b}.mk.f i{background:#c0392b;border-radius:3px;transform:rotate(45deg)}
.mk span{font:700 12px system-ui;color:#111;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;margin-top:2px}
</style></head><body>
<div id="app"><header>Uni-Fahrplan</header>
<div id="mapView"><div id="map"></div><div id="banner"></div><button id="addb">＋</button><div id="sheet"></div></div>
<div id="listView"></div>
<nav><button id="n1" class="on">🗺 Karte</button><button id="n2">📋 Übersicht</button></nav></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const U=[["Dortmund",51.51,7.47],["Dresden",51.05,13.74],["Freiburg",47.99,7.85],["Kiel",54.32,10.14],["Lüneburg",53.25,10.41],["Osnabrück",52.28,8.05],["Paderborn",51.72,8.75],["Tübingen",48.52,9.06]];
const P={S:{n:"Schwaigern (BW)",lat:49.14,lon:9.04},G:{n:"Gronau (Niedersachsen)",lat:51.97,lon:9.80}};
let D={},PL=null;
try{D=JSON.parse(localStorage.getItem("unis")||"{}")}catch(e){}
try{PL=JSON.parse(localStorage.getItem("places")||"null")}catch(e){}
if(!Array.isArray(PL)||!PL.length)PL=U.map(u=>({n:u[0],lat:u[1],lon:u[2]}));
const ens=n=>{D[n]=Object.assign({rating:0,pros:"",cons:"",notes:"",kmS:"",bahnS:"",autoS:"",kmG:"",bahnG:"",autoG:""},D[n]||{})};
PL.forEach(p=>ens(p.n));
const save=()=>{try{localStorage.setItem("unis",JSON.stringify(D));localStorage.setItem("places",JSON.stringify(PL))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lux=(a,b,c,d)=>{const r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return Math.round(12742*Math.asin(Math.sqrt(x)))};
const stars=n=>"★".repeat(n)+"☆".repeat(5-n);
const $=id=>document.getElementById(id);
let open=null,pending=null,grp;
const map=L.map("map",{zoomControl:false}).setView([51.0,10.0],6);
L.control.zoom({position:"topright"}).addTo(map);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles © Esri"}).addTo(map);
const icon=(n,cls)=>L.divIcon({className:"",iconSize:[0,0],html:`<div class="mk ${cls}"><i></i><span>${esc(n)}</span></div>`});
function drawMarkers(){
 if(grp)grp.remove();grp=L.layerGroup().addTo(map);
 for(const k in P)L.marker([P[k].lat,P[k].lon],{icon:icon(k=="S"?"Schwaigern":"Gronau","f"),interactive:false}).addTo(grp);
 PL.forEach(p=>L.marker([p.lat,p.lon],{icon:icon(p.n,p.c?"c":"")}).on("click",()=>sheet(p.n)).addTo(grp));
}
function sheet(n){
 const d=D[n],u=PL.find(x=>x.n==n),sh=$("sheet");
 const lf=k=>{const p=P[k];return `<div class="row"><span>${p.n}</span><b>${d["km"+k]?esc(d["km"+k])+" km":"≈ "+lux(u.lat,u.lon,p.lat,p.lon)+" km Luftlinie"}</b></div><div class="pill">🚆 ${esc(d["bahn"+k])||"–"} &nbsp; 🚗 ${esc(d["auto"+k])||"–"}</div>`};
 sh.innerHTML=`<div style="float:right;font-size:22px;cursor:pointer" id="x">✕</div><h3>${esc(n)}</h3><div class="stars">${stars(d.rating)}</div>${lf("S")}${lf("G")}<label>Vorteile</label><div>${esc(d.pros)||"–"}</div><label>Nachteile</label><div>${esc(d.cons)||"–"}</div><label>Notizen</label><div>${esc(d.notes)||"–"}</div><button class="btn" id="ed">Bearbeiten</button>`;
 sh.style.display="block";$("x").onclick=()=>sh.style.display="none";
 $("ed").onclick=()=>{open=n;show(2)};
}
function addPlace(n,lat,lon){
 n=n.trim();
 if(!n)return"Bitte einen Namen eingeben.";
 if(PL.some(p=>p.n.toLowerCase()==n.toLowerCase()))return"Diesen Namen gibt es schon.";
 PL.push({n,lat,lon,c:true});ens(n);save();drawMarkers();map.setView([lat,lon],Math.max(map.getZoom(),9));sheet(n);return"";
}
function form(){
 const sh=$("sheet");
 sh.innerHTML=`<div style="float:right;font-size:22px;cursor:pointer" id="x">✕</div><h3>Neuer Ort</h3><label>Name / Stadt</label><input id="fn" placeholder="z.B. Göttingen"><div class="hint" id="fe" style="color:#c0392b;margin-top:6px"></div><button class="btn" id="fs">🔍 Suchen und hinzufügen</button><button class="btn s" id="fm">📍 Stattdessen auf Karte tippen</button>`;
 sh.style.display="block";$("x").onclick=()=>sh.style.display="none";
 $("fs").onclick=async()=>{
  const n=$("fn").value,er=m=>$("fe").textContent=m;
  if(!n.trim())return er("Bitte einen Namen eingeben.");
  er("Suche …");
  try{
   const r=await(await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(n))).json();
   if(!r.length)return er("Nicht gefunden – nutze „Auf Karte tippen“.");
   er(addPlace(n,parseFloat(r[0].lat),parseFloat(r[0].lon)));
  }catch(e){er("Suche nicht möglich (Internet?). Nutze „Auf Karte tippen“.")}
 };
 $("fm").onclick=()=>{
  const n=$("fn").value.trim(),er=m=>$("fe").textContent=m;
  if(!n)return er("Bitte einen Namen eingeben.");
  if(PL.some(p=>p.n.toLowerCase()==n.toLowerCase()))return er("Diesen Namen gibt es schon.");
  pending=n;sh.style.display="none";$("banner").textContent="Tippe auf die Karte, um „"+n+"“ zu setzen";$("banner").style.display="block";
 };
}
map.on("click",e=>{
 if(!pending)return;
 const n=pending;pending=null;$("banner").style.display="none";addPlace(n,e.latlng.lat,e.latlng.lng);
});
$("addb").onclick=form;
function list(){
 $("listView").innerHTML=PL.map(u=>{const n=u.n,d=D[n];return `<div class="card ${open==n?"open":""}" data-c="${esc(n)}"><div class="hd"><div><b>${esc(n)}${u.c?" 🟠":""}</b><div class="sub">Schw.: ${d.kmS?esc(d.kmS)+" km":"–"} · Gronau: ${d.kmG?esc(d.kmG)+" km":"–"}</div></div><div class="stars" id="st-${esc(n)}">${stars(d.rating)}</div></div>
 <div class="body"><label>Bewertung</label><div class="rate" data-r="${esc(n)}">${[1,2,3,4,5].map(i=>`<button class="${i<=d.rating?"on":""}" data-v="${i}">★</button>`).join("")}</div>
 ${["S","G"].map(k=>{const p=P[k];return `<div class="place">${p.n}</div><div class="hint">Luftlinie ≈ ${lux(u.lat,u.lon,p.lat,p.lon)} km</div><div class="g"><div><label>Kilometer</label><input inputmode="numeric" data-n="${esc(n)}" data-f="km${k}" value="${esc(d["km"+k])}"></div><div><label>🚆 Bahn</label><input placeholder="z.B. 5h 20" data-n="${esc(n)}" data-f="bahn${k}" value="${esc(d["bahn"+k])}"></div><div><label>🚗 Auto</label><input placeholder="z.B. 4h" data-n="${esc(n)}" data-f="auto${k}" value="${esc(d["auto"+k])}"></div></div>`}).join("")}
 <label>Vorteile</label><textarea data-n="${esc(n)}" data-f="pros">${esc(d.pros)}</textarea><label>Nachteile</label><textarea data-n="${esc(n)}" data-f="cons">${esc(d.cons)}</textarea><label>Notizen</label><textarea data-n="${esc(n)}" data-f="notes">${esc(d.notes)}</textarea>
 ${u.c?`<button class="del" data-del="${esc(n)}">Ort löschen</button>`:""}</div></div>`}).join("");
 const m=$("listView");
 m.querySelectorAll(".hd").forEach(h=>h.onclick=()=>{const c=h.parentNode;open=c.classList.toggle("open")?c.dataset.c:null;m.querySelectorAll(".card").forEach(o=>{if(o!==c)o.classList.remove("open")})});
 m.querySelectorAll("[data-f]").forEach(i=>i.oninput=()=>{D[i.dataset.n][i.dataset.f]=i.value;save();
  if(i.dataset.f.startsWith("km")){const c=i.closest(".card"),d=D[i.dataset.n];c.querySelector(".sub").textContent="Schw.: "+(d.kmS?d.kmS+" km":"–")+" · Gronau: "+(d.kmG?d.kmG+" km":"–")}});
 m.querySelectorAll(".rate").forEach(r=>r.onclick=e=>{const v=+e.target.dataset.v;if(!v)return;const n=r.dataset.r;D[n].rating=D[n].rating==v?0:v;save();
  r.querySelectorAll("button").forEach((b,i)=>b.className=i<D[n].rating?"on":"");$("st-"+n).textContent=stars(D[n].rating)});
 m.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
  if(!b.dataset.s){b.dataset.s=1;b.textContent="Sicher? Nochmal tippen";return}
  const n=b.dataset.del;PL=PL.filter(p=>p.n!=n);delete D[n];open=null;save();drawMarkers();list()});
 const o=m.querySelector(".open");if(o)o.scrollIntoView();
}
function show(t){
 $("n1").className=t==1?"on":"";$("n2").className=t==2?"on":"";
 $("mapView").style.display=t==1?"block":"none";$("listView").style.display=t==2?"block":"none";
 if(t==1){$("sheet").style.display="none";setTimeout(()=>map.invalidateSize(),50)}else list();
}
$("n1").onclick=()=>show(1);$("n2").onclick=()=>show(2);
drawMarkers();show(1);
</script></body></html>
